name: news_app

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ feature-1 ]
  pull_request:

jobs:
  build-deploy:
    runs-on: self-hosted

    env:
      ARTIFACTORY_REPO: ${{ secrets.ARTIFACTORY_REPO }}
      ARTIFACTORY_PATH: news-app
      JF_SERVER_ID: setup-jfrog-ci

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Setup JFrog CLI with OIDC
      - name: Setup JFrog CLI (OIDC)
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
        with:
          oidc-provider-name: 'anil'

      - name: Verify JFrog CLI
        run: jf --version

      - name: Check & Install Java 17
        shell: bash
        run: |
          echo "Checking Java..."
          if java -version >/dev/null 2>&1; then
            echo "Java already installed"
            java -version
          else
            echo "Installing Java 17..."
            sudo apt update -y
            sudo apt install -y openjdk-17-jdk
            java -version
          fi

      - name: Check & Install Maven
        shell: bash
        run: |
          echo "Checking Maven..."
          if mvn -version >/dev/null 2>&1; then
            echo "Maven already installed"
            mvn -version
          else
            echo "Installing Maven..."
            sudo apt install -y maven
            mvn -version
          fi

      - name: Check & Install Tomcat 10
        shell: bash
        run: |
          echo "Checking Tomcat installation..."
          if [ -d "/opt/tomcat10" ]; then
            echo "Tomcat already installed"
          else
            echo "Installing Tomcat 10..."
            cd /opt
            sudo wget https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.30/bin/apache-tomcat-10.1.30.tar.gz
            sudo tar -xzf apache-tomcat-10.1.30.tar.gz
            sudo mv apache-tomcat-10.1.30 /opt/tomcat10
            sudo chmod +x /opt/tomcat10/bin/*.sh
          fi

      - name: Build WAR File
        run: mvn clean package -DskipTests

      - name: Upload WAR to Artifactory
        shell: bash
        run: |
          ART_NAME="news-app-${{ github.run_number }}.war"
          echo "Uploading WAR -> $ARTIFACTORY_REPO/$ARTIFACTORY_PATH/$ART_NAME"

          jf rt u "target/news-app.war" \
            "${ARTIFACTORY_REPO}/${ARTIFACTORY_PATH}/${ART_NAME}" --flat=true

          echo "Uploaded as: ${ARTIFACTORY_REPO}/${ARTIFACTORY_PATH}/${ART_NAME}"
        env:
          JF_URL: ${{ secrets.JF_URL }}

      - name: Deploy WAR to Tomcat
        shell: bash
        run: |
          echo "Stopping Tomcat..."
          sudo /opt/tomcat10/bin/shutdown.sh || true
          sleep 5

          echo "Cleaning old deployment..."
          sudo rm -rf /opt/tomcat10/webapps/news-app
          sudo rm -f /opt/tomcat10/webapps/news-app.war

          echo "Deploying new WAR..."
          sudo cp target/news-app.war /opt/tomcat10/webapps/

          echo "Starting Tomcat..."
          sudo /opt/tomcat10/bin/startup.sh

          echo "Waiting for Tomcat to boot..."
          sleep 20

      - name: Status Check
        run: |
          echo "Checking if app responds..."
          curl -I http://65.2.141.61:8080/news-app/ || true

      - name: Verify App Content
        shell: bash
        run: |
          echo "Validating application output..."
          RESPONSE=$(curl -s http://65.2.141.61:8080/news-app/)

          echo "$RESPONSE" | grep "Welcome to news App" || echo "❌ Missing: Welcome  message"
          echo "$RESPONSE" | grep "Live News Categories" || echo "❌ Missing: News categories"
          echo "$RESPONSE" | grep "Top Headlines" || echo "❌ Missing: Headlines"

          echo "Stopping Tomcat after verification..."
          sudo /opt/tomcat10/bin/shutdown.sh || true
